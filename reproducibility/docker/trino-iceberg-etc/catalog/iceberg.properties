# Iceberg tables in a warehouse on the container's local file system, with Trino's file-based catalog: the whole
# engine side is one container (no object store, no catalog service).
connector.name=iceberg
iceberg.catalog.type=TESTING_FILE_METASTORE
hive.metastore.catalog.dir=local:///warehouse
fs.native-local.enabled=true
local.location=/data/trino/iceberg
