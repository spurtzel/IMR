coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# @QUERY_MEM@ / @HEAP@ are filled in when the image is built (Dockerfile.trino: TRINO_HEAP_GB)
query.max-memory=@QUERY_MEM@GB
query.max-memory-per-node=@QUERY_MEM@GB
memory.heap-headroom-per-node=1GB

spill-enabled=true
spiller-spill-path=/tmp/trino-spill

# The measurement discipline of the paper's Trino runs (the experiment drivers set both per session as well):
# no join reordering, no intra-query parallelism.
optimizer.join-reordering-strategy=NONE
task.concurrency=1
