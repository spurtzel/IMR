coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

query.max-memory=2GB
query.max-memory-per-node=2GB
memory.heap-headroom-per-node=1GB

spill-enabled=true
spiller-spill-path=/tmp/trino-spill

# The paper's measurement discipline, additionally pinned server-side (the runners
# also pin both per session): no join reordering, no intra-query parallelism.
optimizer.join-reordering-strategy=NONE
task.concurrency=1
